{% extends 'base.html' %}

{% block content %}

<div class="login-container">

    <h2>Login</h2>

    {% if erro %}

        <p style="color:red; text-align:center; margin-bottom:15px;">
            {{ erro }}
        </p>

    {% endif %}

    <form action="/login/" method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                name="email"
                required
            >

        </div>

        <div class="form-group">

            <label>Senha</label>

            <input
                type="password"
                name="senha"
                required
            >

        </div>

        <button type="submit">
            Entrar
        </button>

    </form>

</div>

{% endblock %}
